<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next PS — Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --gold: #f0c040;
            --gold-dark: #c89520;
            --bg-card: #120c1f; /* Warna gelap solid */
            --bg-input: #0a0614;
            --border: rgba(240, 192, 64, 0.3);
            --text-light: #f0e8d8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            background-color: #000000; /* Hitam Polos */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            color: var(--text-light);
            overflow: hidden;
        }

        .login-container {
            width: 90%;
            max-width: 360px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        h2 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            margin-bottom: 25px;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--gold);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 16px;
            color: #000;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-login:active {
            opacity: 0.8;
        }

        .btn-register {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--gold);
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 13px;
            margin-top: 20px;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Hilangkan panah di input number jika ada */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body>

<div class="login-container">
    <h2>NEXT PS</h2>

    <form method="POST" action="/player/growid/login/validate">
        <input type="text" name="growId" class="form-control" placeholder="GrowID" required spellcheck="false" />
        <input type="password" name="password" class="form-control" placeholder="Password" required />
        <button type="submit" class="btn-login">LOGIN</button>
    </form>

    <form method="POST" action="/player/growid/login/validate">
        <input type="hidden" name="growId" value="" />
        <input type="hidden" name="password" value="" />
        <button type="submit" class="btn-register">CREATE NEW ACCOUNT</button>
    </form>
</div>

</body>
</html>
